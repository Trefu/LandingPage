<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acoustic Guitars — handcrafted instruments for every stage. A Vue 3 + Tailwind CSS landing page."
    />
    <title>Acoustic Guitars — Handcrafted Instruments</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink-900 text-ink-50 font-sans antialiased">
    <div id="app"></div>
    <!--
      Make sure the freeCodeCamp test-panel's hamburger starts CLOSED on every
      fresh load. The FCC bundle reads `fCC_<project>_hide` from localStorage
      on DOMContentLoaded and only then activates the closed visual (bars +
      panel slid off-screen). The template defaults to the open state and
      only switches when that storage flag is present. We pre-seed the flag
      for every known project name so the bundle always boots into CLOSED,
      regardless of whatever the user did last.
    -->
    <script>
      try {
        var ls = window.localStorage;
        var PREFIX = 'fCC_';
        // Pre-seed the hide flag for every known FCC project name.
        var PROJECTS = [
          '',
          'product-landing-page',
          'build-a-product-landing-page',
          'build-a-tribute-page',
          'build-a-personal-portfolio-webpage',
          'build-a-survey-form',
        ];
        var seen = {};
        for (var i = 0; i < PROJECTS.length; i++) {
          var key = PREFIX + PROJECTS[i] + '_hide';
          ls.setItem(key, 'true');
          seen[key] = true;
        }
        // Also seed the `He = null` project key — when project_selector is
        // unset, FCC reads `fCC` + null + `_hide`, stringifying to
        // `fCCnull_hide`.
        var NULL_KEY = 'fCC' + null + '_hide';
        ls.setItem(NULL_KEY, 'true');
        seen[NULL_KEY] = true;
        // Flip any other fCC_*_hide entries we don't know about too.
        var all = [];
        for (var k = 0; k < ls.length; k++) all.push(ls.key(k));
        for (var m = 0; m < all.length; m++) {
          if (/^fCC_.*_hide$/.test(all[m]) && !seen[all[m]]) {
            ls.setItem(all[m], 'true');
          }
        }
        // Force empty-string project_selector so He = '' and the bundle uses
        // our seeded `fCC__hide` key.
        ls.setItem('project_selector', '');
      } catch (_) {}
    </script>
    <!--
      freeCodeCamp testable bundle.
      Required for the certified Product Landing Page tests to keep passing.
      All required DOM hooks (#header, #nav-bar, .nav-link, #header-img,
      #form, #email, #submit, #video) must exist in the rendered Vue app.
    -->
    <script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
